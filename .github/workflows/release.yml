name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/win-x64/XIVToolHub.exe -DestinationPath XIVToolHub-win-x64.zip
          gh release create "${{ github.ref_name }}" XIVToolHub-win-x64.zip `
            --title "XIVToolHub ${{ github.ref_name }}" --notes "XIVToolHub ${{ github.ref_name }}"
